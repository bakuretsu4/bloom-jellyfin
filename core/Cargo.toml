[package]
name = "bloom-core"
version = "0.1.1"
description = "Bloom's Jellyfin client, playback logic, downloads and settings, without a user interface"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
uuid = { version = "1", features = ["v4"] }
# Cuts seek-bar thumbnails out of Jellyfin's tiles (images.rs). JPEG only.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
url = "2"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", default-features = false, features = ["sync", "time", "net", "io-util", "process", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications (notify.rs).
dbus = "0.9"
# statvfs, for the free space Downloads shows and checks before a download starts.
libc = "0.2"
