name: Feature request
description: Suggest something Bloom could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Bloom is a small project, so not everything will fit, but every
        suggestion is read.
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Screenshots or examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead
